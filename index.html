<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Germán Reina</title>
<meta name="description" content="Germán Reina. Art Director from Lanzarote. Creator of the art for OlliOlli World. Artist at Supercell.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- body:start -->
<header class="bar">
  <nav class="modes" aria-label="View">
    <a class="modes__btn" href="#gallery" data-mode="gallery">Boring home</a>
    <a class="modes__btn" href="#index" data-mode="index">Work</a>
    <a class="modes__btn" href="#play" data-mode="play">Play</a>
  </nav>
  <a class="bar__out" href="https://artdiscipline.com" target="_blank" rel="noopener">Art Discipline ↗</a>
</header>

<main>
  <section class="view gallery is-space" id="view-gallery" aria-label="Home">
    <div class="hero" id="hero">
      <div class="hero__stage" id="hero-stage" aria-hidden="true">
        <canvas class="hero__canvas" id="hero-canvas"></canvas>
        <video class="hero__video" id="hero-video" autoplay muted loop playsinline poster="images/home/ra-poster.jpg">
          <source src="images/home/ra.mp4" type="video/mp4">
        </video>
      </div>
      <div class="walltext walk__intro" id="hero-intro"></div>
    </div>
    <button class="daybtn" id="daybtn" type="button" aria-pressed="false"><svg class="daybtn__skull" aria-hidden="true" viewBox="0 0 16 16" width="15" height="15"><path fill="currentColor" fill-rule="evenodd" d="M8 1C4.4 1 2 3.5 2 6.8c0 1.9.8 3.3 2 4.2V13c0 .6.4 1 1 1h.7v-1.4h1V14h2.6v-1.4h1V14h.7c.6 0 1-.4 1-1v-2c1.200-.9 2-2.300 2-4.200C14 3.500 11.600 1 8 1ZM5.600 5.600a1.500 1.600 0 1 0 0 3.200 1.500 1.600 0 0 0 0-3.200Zm4.800 0a1.500 1.600 0 1 0 0 3.200 1.500 1.600 0 0 0 0-3.200ZM8 9.300l-.9 1.700h1.800L8 9.300Z"/></svg><span id="daybtn-label">Behead</span></button>
    <div class="room" id="room" hidden></div>
    <div class="gallery__foot">
      <span id="room-count"></span>
      <span class="gallery__hint" id="hint"></span>
    </div>
  </section>

  <section class="view index" id="view-index" aria-label="Work" hidden>
    <div class="index__wrap">
      <div class="index__head">
        <h1 class="index__title">Work</h1>
        <div class="filters" role="group" aria-label="Filter projects">
          <button class="chip" type="button" data-filter="all" aria-pressed="true">Everything</button>
          <button class="chip" type="button" data-filter="studio" aria-pressed="false">Studio work</button>
          <button class="chip" type="button" data-filter="own" aria-pressed="false">Own projects</button>
        </div>
      </div>
      <p class="index__note" id="index-note"></p>
      <div class="table" id="table"></div>
      <footer class="index__foot" id="index-foot"></footer>
    </div>
  </section>
  <section class="view index" id="view-about" aria-label="About" hidden>
    <div class="index__wrap">
      <h1 class="index__title">About</h1>
      <div class="about">
        <div class="about__main">
          <p class="about__lead" id="about-lead"></p>
          <p class="about__text" id="about-text"></p>
          <section class="about__block">
            <h2>Experience</h2>
            <div class="rows" id="experience"></div>
          </section>
        </div>
        <div class="about__side">
          <figure class="about__photo" id="about-photo"></figure>
          <section class="about__block">
            <h2>Talks &amp; workshops</h2>
            <div class="rows" id="talks"></div>
          </section>
        </div>
      </div>
      <section class="about__contact">
        <h2>Get in touch</h2>
        <p class="about__mail"><a id="about-mail"></a></p>
        <div class="about__links" id="about-links"></div>
      </section>
      <footer class="index__foot about__foot" id="about-foot"></footer>
    </div>
  </section>
  <section class="view index project" id="view-project" aria-label="Project" hidden>
    <div class="index__wrap" id="project-body"></div>
  </section>
  <section class="view play" id="view-play" aria-label="Play" hidden>
    <div class="play__head">
      <h1 class="index__title">Play <span class="play__now" id="play-now" aria-live="polite"></span></h1>
      <p class="play__note">Interactive sites and games.</p>
    </div>
    <figure class="play__frame" id="play-frame" aria-hidden="true">
      <div class="play__shot" id="play-shot"><a class="play__go" id="play-go" target="_blank" rel="noopener" tabindex="-1"></a></div>
      <figcaption id="play-cap"></figcaption>
    </figure>
    <nav class="play__list" id="play-list" aria-label="Interactive projects"></nav>
    <p class="play__foot" id="play-foot"></p>
    <div class="play__cross play__cross--h" id="cross-h" aria-hidden="true"></div>
    <div class="play__cross play__cross--v" id="cross-v" aria-hidden="true"></div>
    <span class="play__xy" id="cross-xy" aria-hidden="true"></span>
  </section>
</main>

<dialog class="zoom" id="zoom" aria-label="Image">
  <div class="zoom__stage" id="zoom-stage"><img id="zoom-img" alt=""></div>
  <div class="zoom__bar">
    <span class="zoom__cap" id="zoom-cap"></span>
    <button type="button" id="zoom-prev" aria-label="Previous image">←</button>
    <button type="button" id="zoom-next" aria-label="Next image">→</button>
    <button type="button" id="zoom-size">Actual size</button>
    <button type="button" id="zoom-close">Close ✕</button>
  </div>
</dialog>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <button class="sheet__close" type="button" id="sheet-close" aria-label="Close">Close ✕</button>
  <div class="sheet__body" id="sheet-body"></div>
</dialog>
<!-- body:end -->
<script src="js/projects.js"></script>
<script src="js/main.js"></script>
</body>
</html>
